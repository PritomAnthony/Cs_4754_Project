<head>
    <title>Hotel Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to our Hotel Management System.</h1>
    <div>
        <h3>Click the button below to see the list of the hotels we service.</h3>
        <button id="hotels-btn">List of hotels</button>
        <button id="clear-btn">Clear</button>
        <div id="hotel-list"></div>
    </div>
    <div>
        <h3>Top 5 hotels based on number of bookings:</h3>
        <div id="top-hotels-list"></div>
    </div>
    <div id="create-booking">
        <h3>Create a booking:</h3>
        <label for="check-in-date">Check in date:</label>
        <input type="date" id="check-in-date">
        <label for="check-out-date">Check out date:</label>
        <input type="date" id="check-out-date">
        <label for="hotel-number">Hotel number (from list above):</label>
        <input id="hotel-number">
    </div>

    <script src="scripts/hotel.js"></script>
    <script src="scripts/tophotels.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const clearButton = document.getElementById('clear-btn');
            const hotelListDiv = document.getElementById('hotel-list');

            clearButton.addEventListener('click', () => {
                hotelListDiv.innerHTML = '';
            });
        });

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('check-in-date').setAttribute('min', today);
        document.getElementById('check-out-date').setAttribute('min', today);
    </script>
</body>
